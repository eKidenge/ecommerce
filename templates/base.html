<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}E-Store - Your Premium Online Shopping Destination{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}Shop the best products at E-Store. Quality products at competitive prices.{% endblock %}">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts - Government Style -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=Source+Sans+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    {% load static %}
    <!-- Cache-busting with timestamp -->
    <link rel="stylesheet" href="{% static 'css/base.css' %}?v=20240810">
    {% block extra_css %}{% endblock %}
    
    <style>
        /* Force green/gold theme - overrides any cached styles */
        :root {
            --primary-green: #0a4a2a;
            --primary-green-dark: #062a18;
            --primary-green-light: #1a7a3a;
            --gold: #c9a84c;
            --gold-light: #f5edd6;
            --gold-dark: #a88a3a;
        }
        
        /* Global theme override */
        .bg-primary-green { 
            background: linear-gradient(135deg, #0a4a2a 0%, #062a18 50%, #0a4a2a 100%) !important; 
        }
        .text-gold { color: #c9a84c !important; }
        .border-gold { border-color: #c9a84c !important; }
        .btn-gold { 
            background: #c9a84c !important; 
            color: #0a4a2a !important; 
            border: 2px solid #c9a84c !important;
        }
        .btn-gold:hover {
            background: #a88a3a !important;
            border-color: #a88a3a !important;
            color: white !important;
        }
        .btn-outline-gold {
            border: 2px solid #c9a84c !important;
            color: #c9a84c !important;
            background: transparent !important;
        }
        .btn-outline-gold:hover {
            background: #c9a84c !important;
            color: #0a4a2a !important;
        }
        .hover-gold:hover {
            color: #c9a84c !important;
        }
        
        /* Body and base */
        body {
            font-family: 'Source Sans Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f5f5f0;
            color: #1a1a1a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Playfair Display', 'Times New Roman', serif;
            font-weight: 700;
            color: #0a4a2a;
        }
        .main-content {
            flex: 1;
        }
        
        /* Cart badge */
        .cart-badge {
            position: absolute;
            top: -5px;
            right: -8px;
            font-size: 0.65rem;
            padding: 0.2rem 0.5rem;
            background: #c9a84c !important;
            color: #0a4a2a !important;
            font-weight: 700 !important;
            border: 2px solid #0a4a2a;
        }
        
        /* Toast container */
        #toast-container {
            z-index: 9999;
        }
        .toast.bg-success {
            background: linear-gradient(135deg, #0a4a2a 0%, #1a7a3a 100%) !important;
            border: 2px solid #c9a84c !important;
        }
        .toast.bg-danger {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%) !important;
            border: 2px solid #c9a84c !important;
        }
        .toast.bg-warning {
            background: linear-gradient(135deg, #c9a84c 0%, #a88a3a 100%) !important;
            color: #0a4a2a !important;
            border: 2px solid #0a4a2a !important;
        }
        
        /* Scroll to top */
        .scroll-to-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0a4a2a 0%, #062a18 100%);
            color: white;
            border: 2px solid #c9a84c;
            box-shadow: 0 5px 20px rgba(10, 74, 42, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            cursor: pointer;
            z-index: 999;
            opacity: 0;
            visibility: hidden;
        }
        .scroll-to-top.visible {
            opacity: 1;
            visibility: visible;
        }
        .scroll-to-top:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 30px rgba(10, 74, 42, 0.4);
            background: #c9a84c;
            color: #0a4a2a;
        }
        
        /* Loading spinner */
        .spinner-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .spinner-overlay .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #c9a84c;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up {
            animation: slideUp 0.6s ease forwards;
            opacity: 0;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .scroll-to-top {
                width: 40px;
                height: 40px;
                bottom: 20px;
                right: 20px;
            }
            .scroll-to-top i {
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    {% include 'includes/header.html' %}
    
    <!-- Navbar -->
    {% include 'includes/navbar.html' %}
    
    <!-- Messages -->
    {% include 'includes/messages.html' %}
    
    <!-- Main Content -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>
    
    <!-- Footer -->
    {% include 'includes/footer.html' %}
    
    <!-- Scroll to Top Button -->
    <button class="scroll-to-top" aria-label="Scroll to top">
        <i class="fas fa-arrow-up"></i>
    </button>
    
    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <!-- Stripe JS -->
    <script src="https://js.stripe.com/v3/"></script>
    <!-- Custom JS with cache-busting -->
    <script src="{% static 'js/base.js' %}?v=20240810"></script>
    {% block extra_js %}{% endblock %}
    
    <script>
        // Scroll to top functionality
        document.addEventListener('DOMContentLoaded', function() {
            const scrollBtn = document.querySelector('.scroll-to-top');
            
            if (scrollBtn) {
                window.addEventListener('scroll', function() {
                    if (window.scrollY > 300) {
                        scrollBtn.classList.add('visible');
                    } else {
                        scrollBtn.classList.remove('visible');
                    }
                });
                
                scrollBtn.addEventListener('click', function() {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
            }
            
            // Auto-dismiss alerts after 5 seconds
            setTimeout(function() {
                document.querySelectorAll('.alert').forEach(function(alert) {
                    const bsAlert = bootstrap.Alert.getInstance(alert);
                    if (bsAlert) {
                        bsAlert.close();
                    }
                });
            }, 5000);
        });
    </script>
</body>
</html>
